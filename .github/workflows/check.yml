name: check for the deal

on:
  schedule:
    # 15:00 UTC = 8am PDT / 7am PST, after every West Coast game has gone final.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Game day to check (YYYY-MM-DD). Blank = yesterday, Pacific."
        required: false
      dry_run:
        description: "Print the notification instead of sending it"
        type: boolean
        default: false

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Survives between runs so a manual re-run doesn't double-notify.
      - uses: actions/cache@v4
        with:
          path: .state.json
          key: panda-state-${{ github.run_id }}
          restore-keys: panda-state-

      - run: dotnet publish src/PandaPlateWatch -c Release -o ./app

      - name: check yesterday's game
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_PRIORITY: ${{ vars.NTFY_PRIORITY }}
          NTFY_TAGS: ${{ vars.NTFY_TAGS }}
          PANDA_DEAL_PRICE: ${{ vars.PANDA_DEAL_PRICE }}
          PANDA_PROMO_CODE: ${{ vars.PANDA_PROMO_CODE }}
          DATE_ARG: ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          DRY_RUN_ARG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: ./app/panda-plate-watch --state-file .state.json $DATE_ARG $DRY_RUN_ARG
