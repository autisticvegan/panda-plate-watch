name: check for the deal

on:
  schedule:
    # 15:00 UTC = 8am PDT / 7am PST, after every West Coast game has gone final.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Game day to check (YYYY-MM-DD). Blank = yesterday, Pacific."
        required: false
      dry_run:
        description: "Print the notification instead of sending it"
        type: boolean
        default: false

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Survives between runs so a manual re-run doesn't double-notify.
      - uses: actions/cache@v4
        with:
          path: .state.json
          key: panda-state-${{ github.run_id }}
          restore-keys: panda-state-

      - run: pip install .

      - name: check yesterday's game
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          NTFY_PRIORITY: ${{ vars.NTFY_PRIORITY }}
          PANDA_DEAL_PRICE: ${{ vars.PANDA_DEAL_PRICE }}
          PANDA_PROMO_CODE: ${{ vars.PANDA_PROMO_CODE }}
        run: |
          panda-plate-watch \
            --state-file .state.json \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
